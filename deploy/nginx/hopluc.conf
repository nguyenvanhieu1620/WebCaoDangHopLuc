# Nginx đứng trước web Next.js (127.0.0.1:3000) — https, chuyển hướng, giới hạn tần suất, phục vụ ảnh tải lên.
# Cài (xem deploy/README.md mục 8):
#   sed 's/__DOMAIN__/hopluc.edu.vn/g' deploy/nginx/hopluc.conf | sudo tee /etc/nginx/sites-available/hopluc
#   sudo ln -s /etc/nginx/sites-available/hopluc /etc/nginx/sites-enabled/hopluc
#   sudo nginx -t && sudo systemctl reload nginx
# Viết cho nginx 1.24 (Ubuntu 24.04); bản mới hơn chỉ cảnh báo cú pháp "listen ... http2", vẫn chạy.

# Lớp giới hạn thứ 2 cho API form công khai (lớp 1 nằm trong web, src/lib/rate-limit.ts).
limit_req_zone $binary_remote_addr zone=hopluc_api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=hopluc_uploads:10m;

upstream hopluc_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# http → https (tên miền chính)
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

# www → tên miền chính
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hopluc_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # API/form công khai nhỏ; chỉ khu admin được gửi tệp lớn.
    client_max_body_size 1m;

    access_log /var/log/nginx/hopluc.access.log;
    error_log  /var/log/nginx/hopluc.error.log warn;

    # Trình duyệt luôn dùng https với tên miền này trong 1 năm. Chỉ để dòng này khi https đã chạy ổn.
    # Lưu ý: add_header trong 1 location làm MẤT các add_header kế thừa — location /uploads/ nhắc lại.
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Web lấy IP khách = mục CUỐI của X-Forwarded-For → .env phải có TRUST_PROXY_HOPS="1".
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;

    # Ảnh/video/tài liệu admin tải lên: Nginx đọc thẳng từ ổ đĩa (nhanh, tua video được), chỉ các đuôi web
    # cho phép tải lên (src/lib/file-signature.ts); đuôi khác và file ẩn (.gitkeep…) → 404.
    location ^~ /uploads/ {
        root /srv/hopluc/shared;
        location ~* \.(jpe?g|png|webp|gif|mp4|webm|pdf|docx?|xlsx?)$ {
            add_header Cache-Control "public, max-age=60, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            try_files $uri =404;
        }
        return 404;
    }

    location /api/ {
        limit_req zone=hopluc_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://hopluc_web;
    }

    location ^~ /admin/ {
        client_max_body_size 60m;
        limit_conn hopluc_uploads 4;
        limit_conn_status 429;
        proxy_pass http://hopluc_web;
    }

    location = /admin {
        client_max_body_size 60m;
        limit_conn hopluc_uploads 4;
        limit_conn_status 429;
        proxy_pass http://hopluc_web;
    }

    location / {
        proxy_pass http://hopluc_web;
    }
}
